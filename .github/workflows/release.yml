# Binaries for a tag, so the install instruction can be "download and run" instead of
# "install a toolchain first". Light has no page to build and no bundle to embed, so this is
# the full product's release workflow with the node half taken out.
name: release

on:
  push:
    tags: ["v*"]
  # Buildable without a tag to prove the workflow itself, which is otherwise only ever
  # exercised at the worst possible moment.
  workflow_dispatch:

# Read-only by default (L9, 2026-10-31). The build job runs third-party actions and
# compiles the code; with a write token there, a compromised action could have replaced the
# binary and its checksum on the release. Only `publish` writes, and runs nothing it builds.
# Every action is pinned to a commit, not to a tag that can be moved; Dependabot keeps the
# pins current.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: cbl
          - os: windows-latest
            name: windows-x86_64
            bin: cbl.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # No rust-cache here, as in the full product: the cache is shared with ordinary CI
      # runs, and whatever one of them put in it would end up in the binary people download.
      # A release builds from nothing.

      - name: build the binary
        run: cargo build --release

      # The tag says what it is; the binary has to agree. A release built from the wrong
      # commit is the kind of thing nobody notices until someone reports a fixed bug.
      - name: the binary agrees with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(target/release/${{ matrix.bin }} --version | awk '{print $2}')"
          test "$want" = "$got" || { echo "::error::tag $want, binary $got"; exit 1; }

      # Not a smoke test for its own sake: this is the first run on a machine that has never
      # seen a store, which is the state every new user is in. Same steps as ci.yml, run
      # against the artefact that actually ships.
      - name: it works on a machine that has never run it
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          B="$GITHUB_WORKSPACE/target/release/${{ matrix.bin }}"
          "$B" init
          "$B" write --ring 2 --kind knowledge --name release-check --body 'A release that cannot write a note is not a release.'
          "$B" scan
          "$B" recall 'release' | grep -q release-check
          "$B" status | grep -q 'lexical only'
          echo '{}' | "$B" hook session-start > /dev/null
          "$B" doctor

      - name: name it after the platform and hash it
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/cbl-${{ matrix.name }}${{ matrix.bin == 'cbl.exe' && '.exe' || '' }}"
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum * > "SHA256SUMS-${{ matrix.name }}"; else shasum -a 256 * > "SHA256SUMS-${{ matrix.name }}"; fi
          cat "SHA256SUMS-${{ matrix.name }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    name: attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: one directory, one checksum file
        run: |
          mkdir -p out
          find dist -type f -not -name 'SHA256SUMS-*' -exec cp {} out/ \;
          cat dist/*/SHA256SUMS-* > out/SHA256SUMS
          ls -la out
      # A draft, not a publish: the release notes are written by a person, and the tag
      # existing is not the same as the release being ready to read.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: out/*
          body: |
            Binaries for ${{ github.ref_name }}. Verify with `sha256sum -c SHA256SUMS`.

            Nothing is needed at runtime: no system SQLite, no OpenSSL, no model server, no
            node. `cbl --help` to start, `cbl init` in a project.
