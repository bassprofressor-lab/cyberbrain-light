# Three ways this can be wrong in the code: it does not build, it is not formatted the way
# the rest of the tree is, or it does not do what the tests say it does. And one outside it:
# a dependency with an advisory or a licence nobody decided on.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, with no push: a new RustSec advisory against a dependency arrives without any
  # change here, and the deny job below is what notices it.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Reading the code is all this workflow does.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # The first run on a machine that has never seen a store, which is the state every new
  # user is in. A tool whose happy path is only ever exercised on the author's laptop breaks
  # for everyone else and nobody finds out until they say so.
  first-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release
      - shell: bash
        run: |
          cd "$RUNNER_TEMP"
          B="$GITHUB_WORKSPACE/target/release/cbl"
          "$B" init
          "$B" write --ring 2 --kind knowledge --name first-run --body 'A release that cannot write a note is not a release.'
          "$B" scan
          "$B" recall 'release' | grep -q first-run
          "$B" status | grep -q 'lexical only'
          echo '{}' | "$B" hook session-start > /dev/null
          "$B" doctor

  # Licences, advisories, bans and sources, against deny.toml (L10, 2026-10-31).
  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action runs in its own container, and `rust-toolchain.toml` would make it fetch
      # a toolchain it does not need: cargo-deny reads manifests and the lockfile, it does
      # not compile anything. Same step as in the full product.
      - name: keep the toolchain pin out of the deny container
        run: mv rust-toolchain.toml rust-toolchain.toml.off
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - run: mv rust-toolchain.toml.off rust-toolchain.toml
