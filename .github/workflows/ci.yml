# Three jobs, because there are three ways this can be wrong: it does not build, it is not
# formatted the way the rest of the tree is, or it does not do what the tests say it does.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # The first run on a machine that has never seen a store, which is the state every new
  # user is in. A tool whose happy path is only ever exercised on the author's laptop breaks
  # for everyone else and nobody finds out until they say so.
  first-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - shell: bash
        run: |
          cd "$RUNNER_TEMP"
          B="$GITHUB_WORKSPACE/target/release/cbl"
          "$B" init
          "$B" write --ring 2 --kind knowledge --name first-run --body 'A release that cannot write a note is not a release.'
          "$B" scan
          "$B" recall 'release' | grep -q first-run
          "$B" status | grep -q 'lexical only'
          echo '{}' | "$B" hook session-start > /dev/null
          "$B" doctor
