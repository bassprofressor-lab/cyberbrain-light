[package]
name = "cyberbrain-light"
version = "0.2.3"
edition = "2024"
rust-version = "1.98"
license = "FSL-1.1-ALv2"
authors = ["Krynex Labs <info@krynexlabs.de>"]
repository = "https://github.com/bassprofressor-lab/cyberbrain-light"
homepage = "https://krynexlabs.de"
description = "Cited, trust-tiered memory for AI coding agents. Lexical search, one small binary, no model to place and no compliance subsystem."
keywords = ["ai-agents", "memory", "retrieval", "mcp", "markdown"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
include = ["/src/**", "/README.md", "/LICENSE.md"]

[[bin]]
name = "cbl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
# Pinned exactly (L2, 2026-11-19). `^0.10.1` let `cargo install` without `--locked` pull
# core 0.10.7, which added a required field to the public `Frontmatter` in a patch release,
# and the build broke for everyone. A new core comes in by raising this pin together with
# the code and the index schema Light reads, never by itself.
cyberbrain-core = "=0.10.7"
cyberbrain-index = "=0.10.7"
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order`: `cbl install` rewrites a settings.json that belongs to the user, and
# keeps its keys where the user put them.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.5"

# `geteuid`/`getegid` for the ownership check on a store found by walking up. Already in the
# tree through ulid's getrandom, so nothing new is downloaded or built.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
# The schema tests set up an index the way an older or a newer Cyberbrain left it. The same
# version cyberbrain-index links, so nothing new is built.
rusqlite = "0.41.1"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Same reason as the full product: a hook must never take the agent down with it, which is
# implemented by catching the panic and exiting 0. `abort` would leave nothing to catch.
panic = "unwind"
